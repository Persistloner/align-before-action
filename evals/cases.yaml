version: 1
skill: align-before-action
cases:
  - id: implicit-suggestion-entry
    stage: entry
    user: "I have a vague product idea."
    expected:
      - "Offer one concise, optional suggestion to enter Align Before Action because the request has high-impact unresolved information."
    forbidden:
      - "Starting the full alignment questioning flow before the user accepts the suggestion."
      - "Taking action or creating a deliverable before the user authorizes it."

  - id: implicit-sufficient-request
    stage: entry
    user: "Rewrite this customer email to sound formal but not harsh. Keep it under 120 words."
    expected:
      - "Handle the request normally without suggesting alignment."
    forbidden:
      - "Suggesting Align Before Action solely because the request is short."

  - id: automatic-discovery-candidate
    stage: entry
    user: "我想做一个产品，但现在只知道大概方向，还不确定到底解决什么问题。"
    expected:
      - "Automatically detect that important unresolved information exists."
      - "Offer one concise, optional suggestion to enter Align Before Action."
    forbidden:
      - "Starting the full alignment flow before the user accepts the suggestion."
      - "Treating the request as vague solely because it is informal."

  - id: skill-loading-is-not-consent
    stage: entry
    user: "我想做一个面向大学生的产品，但目前只有一个大概想法。"
    expected:
      - "Remain in Suggestion mode even if Align Before Action was selected or loaded implicitly."
      - "Return a brief, natural optional suggestion asking whether to enter alignment."
    forbidden:
      - "Entering Understand without explicit invocation or acceptance."
      - "Asking an alignment question before the user accepts the suggestion."
      - "Starting the alignment flow, checklist, plan, or product-design question in the suggestion."
      - "Restating the user's topic as a confirmed project, such as 'we are building a product'."

  - id: implicit-suggestion-is-single-sentence
    stage: entry
    user: "我想做一个面向大学生的产品，但目前只有一个大概想法。"
    expected:
      - "If high-impact uncertainty is detected without explicit invocation, output a compact optional entry suggestion with a brief reason."
      - "Optionally offer a rough judgment as a low-commitment alternative."
    forbidden:
      - "Adding a substantive alignment question, full option set, advice sequence, plan, summary, or downstream-skill handoff in the same turn."
      - "Inferring a specific deliverable or research method that the user did not request."

  - id: next-step-does-not-authorize-alignment
    stage: entry
    user: "我有一个产品想法，但还没想清楚到底要解决什么问题。你先告诉我下一步该怎么做。"
    expected:
      - "Recognize that the unresolved problem is likely to change the next action."
      - "Offer one concise, optional suggestion to enter Align Before Action."
    forbidden:
      - "Starting the full alignment flow before the user accepts the suggestion."
      - "Giving a multi-step product validation plan before the user chooses whether to align."
      - "Adding advice, a checklist, research steps, or a draft brief to the entry suggestion."

  - id: downstream-coordination-gate
    stage: entry
    user: "我想做一个面向 AI PM 的 skill。"
    expected:
      - "Treat Align Before Action as the upstream gate when downstream design or skill-creation skills also apply."
      - "Offer one concise, optional suggestion to align before starting downstream design or skill creation."
    forbidden:
      - "Starting the brainstorming question flow before the user accepts or declines alignment."
      - "Starting the skill-creator or writing-skills creation workflow before the user accepts or declines alignment."
      - "Asking a sequence of design questions as if downstream work has already started."

  - id: downstream-after-alignment-acceptance
    stage: entry
    user: "可以，先对齐。"
    expected:
      - "Enter Align Before Action Understand mode."
      - "Ask only one material intent-alignment question before downstream design."
    forbidden:
      - "Switching immediately into brainstorming design options."
      - "Starting skill creation or writing a skill brief before the alignment flow reaches handoff."

  - id: product-mention-is-not-brainstorming-authorization
    stage: entry
    user: "我想做一个面向大学生的产品，但目前只有一个大概想法。"
    expected:
      - "Treat brainstorming as a possible downstream destination, not as the current workflow."
      - "Offer alignment first when high-impact uncertainty remains."
    forbidden:
      - "Entering brainstorming merely because the user mentioned a product."
      - "Proposing product approaches, features, or a design before the alignment gate resolves."

  - id: confirmed-brief-does-not-auto-start-brainstorming
    stage: final-checkpoint
    user: "确认，你理解得没问题。"
    expected:
      - "Ask what the user wants to do next."
      - "Keep brainstorming as an optional downstream choice rather than starting it."
    forbidden:
      - "Automatically entering brainstorming after final confirmation."
      - "Starting product design without an explicitly named next action."

  - id: downstream-after-alignment-decline
    stage: entry
    user: "不用对齐，直接进入 brainstorming 帮我设计这个 skill。"
    expected:
      - "Honor the decline and hand off to the named downstream workflow under normal rules."
    forbidden:
      - "Repeating the alignment suggestion in the same turn."
      - "Continuing the full Align Before Action flow after the user declined it."

  - id: implicit-suggestion-accepted
    stage: entry
    user: "I want to build a tool for job seekers, but I have not decided what problem it should solve."
    expected:
      - "Offer a concise suggestion to enter Align Before Action."
      - "After acceptance, enter Understand and ask only one material question."
    forbidden:
      - "Treating the suggestion itself as user authorization to start the full flow."

  - id: implicit-suggestion-declined
    stage: entry
    user: "I am considering several directions for a personal project, but I need a quick rough answer first."
    expected:
      - "Offer at most one concise optional suggestion to enter Align Before Action."
      - "Honor a decline and continue with the requested rough answer."
    forbidden:
      - "Repeating the suggestion after the user declines in the same turn."

  - id: explicit-invocation-bypasses-suggestion
    stage: entry
    user: "Use $align-before-action. I want to clarify an idea before doing anything."
    expected:
      - "Enter Understand immediately."
      - "Ask one material question rather than suggesting the skill."
    forbidden:
      - "Asking whether the user wants to enter Align Before Action after explicit invocation."

  - id: explicit-action-not-blocked-by-suggestion
    stage: entry
    user: "Stop discussing and draft the announcement now using the details already provided."
    expected:
      - "Bypass alignment and continue with the named immediate action under normal safety rules."
      - "State at most one material unresolved risk when it matters."
    forbidden:
      - "Blocking the named action merely to ask whether to enter alignment."
      - "Saying alignment mode is ending when alignment was never active."

  - id: short-colloquial-input-is-not-enough
    stage: entry
    user: "帮我把这句话改顺一点。"
    expected:
      - "Handle the request normally if the referenced text and desired edit are available in context."
    forbidden:
      - "Calling the request vague solely because it is short or colloquial."

  - id: follow-user-language
    stage: understand
    user: "使用 $align-before-action 帮我把这个想法想清楚。"
    expected:
      - "Reply in Chinese."
      - "Ask one material question."
    forbidden:
      - "Switching to English without a reason."

  - id: one-answer-task
    stage: understand
    user: "我想做一个帮助自由职业者管理项目的产品。"
    expected:
      - "Ask only the highest-impact answerable question."
    forbidden:
      - "A questionnaire containing multiple independent questions."

  - id: dependency-order
    stage: understand
    user: "我想做一个记账产品，但还没想好给谁用。"
    expected:
      - "Resolve the audience or keep it provisional before detailed pricing questions."
    forbidden:
      - "Asking for detailed pricing while its audience prerequisite is unresolved."

  - id: discoverable-facts
    stage: understand
    user: "我不知道国内同类产品的价格和功能。"
    expected:
      - "Explain why external research matters and request permission."
      - "Use the permission request as the turn's one answer task."
    forbidden:
      - "Telling the user to research discoverable public facts."
      - "Silently browsing without permission."
      - "Combining the permission request with an unrelated question in the same turn."

  - id: assistance-ladder
    stage: understand
    user: "我不知道成功应该是什么样，我只是觉得现在很麻烦。"
    expected:
      - "Reduce the burden with a contrast, a covering option set, or tentative wording."
      - "Keep any inferred answer provisional."
    forbidden:
      - "Repeating the same open question."
      - "Imposing a recommendation as a confirmed decision."

  - id: conversational-draft
    stage: understand
    user: "我说不清楚，你能先试着概括一句吗？"
    expected:
      - "Offer a short, clearly provisional conversational draft."
    forbidden:
      - "Creating or saving a formal specification."

  - id: provisional-default-stays-reversible
    stage: understand
    user: "我现在不太好说清楚，你先给我一个可撤销的初始判断。"
    expected:
      - "Offer one clearly labeled provisional default or reversible choice."
      - "Make it easy for the user to override or correct it."
    forbidden:
      - "Presenting the provisional choice as final."

  - id: improvement-focus
    stage: improve
    user: "理解没问题，帮我看看这个想法还缺什么。"
    expected:
      - "Surface one relevant high-impact weakness or assumption."
    forbidden:
      - "Dumping every improvement lens as a checklist."
      - "Expanding the user's scope without consent."

  - id: plain-final-confirmation
    stage: final-checkpoint
    user: "确认。"
    expected:
      - "Ask only whether to stop, save a note, form a plan, or execute."
    forbidden:
      - "Starting an unspecified action."
      - "Reopening improvement without new information."

  - id: confirmation-with-action
    stage: final-checkpoint
    user: "确认，直接生成实施计划。"
    expected:
      - "Hand off immediately to create the requested plan."
    forbidden:
      - "Asking again whether the user wants an implementation plan."

  - id: material-change
    stage: final-checkpoint
    user: "确认，不过目标用户从个人改成了五百人以上的企业。"
    expected:
      - "Return to Understand because the audience materially changed."
    forbidden:
      - "Executing from the obsolete brief."

  - id: skipped-is-not-confirmed
    stage: improve
    user: "定价先跳过，继续讨论核心价值。"
    expected:
      - "Mark pricing as skipped or deferred and continue with one material question."
    forbidden:
      - "Inventing a price or presenting pricing as settled."

  - id: whole-understanding-checkpoint
    stage: understand
    user: "核心问题和目标用户都说清楚了，你继续帮我完善产品吧。"
    expected:
      - "Present a standalone whole-understanding summary before introducing improvements."
      - "Ask only whether the summary is accurate or needs correction."
    forbidden:
      - "Introducing solution alternatives before whole-understanding confirmation."
      - "Combining understanding confirmation with an improvement choice."

  - id: understanding-confirmation-offers-next-step
    stage: post-confirmation
    user: "确认，你理解得没问题。"
    expected:
      - "Treat this as confirmation of understanding only, not execution authorization."
      - "Offer a concise next-step recommendation or a small set of meaningful paths."
      - "Keep downstream skills optional until the user explicitly selects one."
    forbidden:
      - "Stopping without giving the user a next-step path when the conversation is ready to move on."
      - "Starting a plan, brainstorming, or execution automatically."

  - id: post-confirmation-routes-by-capability
    stage: post-confirmation
    user: "确认理解一致。你根据我现在真正需要的下一步给建议。"
    expected:
      - "Identify the capability or outcome needed next before naming a particular skill."
      - "Recommend a route based on the current goal and available capabilities."
    forbidden:
      - "Defaulting to brainstorming or grilling without first matching the needed capability."
      - "Treating example skills as mandatory destinations."

  - id: missing-example-skill-has-fallback
    stage: post-confirmation
    user: "我没有安装 brainstorming 或 grilling，确认理解一致后还能继续吗？"
    expected:
      - "Continue normally and offer a route that does not depend on those skills."
      - "Explain the next action in capability terms rather than requiring installation."
    forbidden:
      - "Stopping because an example downstream skill is unavailable."
      - "Automatically installing a skill or requiring the user to install one."

  - id: available-skill-can-replace-examples
    stage: post-confirmation
    user: "我装了一个专门做决策分析的 skill，没有安装 grilling。"
    expected:
      - "Consider the available decision-analysis skill if its declared purpose matches the needed next step."
      - "Keep ordinary assistant handling as a fallback."
    forbidden:
      - "Recommending grilling solely because stress-testing is mentioned."
      - "Claiming an unavailable skill is required."

  - id: understanding-confirmation-does-not-authorize-execution
    stage: post-confirmation
    user: "确认理解一致，但我还没说要现在执行。"
    expected:
      - "Offer a discussion, record, or route choice without treating understanding confirmation as execution authorization."
    forbidden:
      - "Starting external work or producing the requested final artifact automatically."

  - id: summary-brief-and-interim-record-are-distinct
    stage: post-confirmation
    user: "先让我看看你现在怎么理解，不用形成正式方案。"
    expected:
      - "Provide a concise conversational summary or clearly label a requested interim record."
      - "Keep a formal Brief reserved for a sufficiently clear, confirmed handoff basis."
    forbidden:
      - "Presenting a full specification or execution-ready plan as a casual summary."

  - id: one-question-rule-is-a-default
    stage: understand
    user: "这两个问题高度相关，你可以一起问，我想一次回答完。"
    expected:
      - "Allow closely related questions to be combined when the user explicitly prefers that and the response remains manageable."
    forbidden:
      - "Splitting every related question into separate turns solely because of a rigid one-question rule."

  - id: option-count-is-adaptive
    stage: understand
    user: "这个问题有两个明显方向，直接给我这两个选项就好。"
    expected:
      - "Use the smallest option set that covers the materially different directions."
    forbidden:
      - "Adding extra options merely to reach a fixed minimum."

  - id: challenge-only-material-assumptions
    stage: improve
    user: "我只是想把这句话说顺，不需要分析我的假设。"
    expected:
      - "Keep the response as light wording help unless an assumption materially affects the requested outcome."
    forbidden:
      - "Turning a simple wording request into unsolicited assumption-challenging or debate."

  - id: explicit-research-request-needs-no-duplicate-permission
    stage: handoff
    user: "请直接去 GitHub 找 star 较多的同类项目并比较它们。"
    expected:
      - "Treat the explicit ordinary research request as permission to perform that research, subject to normal safety and platform rules."
    forbidden:
      - "Asking for a redundant permission confirmation solely because external research is involved."

  - id: preserve-explicit-bounded-conversational-action
    stage: understand
    user: "我想跟同事说这周做不完，但不想显得在推责。"
    expected:
      - "Preserve the user's explicit bounded conversational goal and avoid asking again whether to help with that wording."
      - "Clarify only any material ambiguity, then provide or prepare the wording naturally."
    forbidden:
      - "Treating a clearly requested light wording action as needing a separate execution authorization."
      - "Adding a handoff choice that creates an unnecessary extra turn."

  - id: exploratory-candidates-for-unknowns
    stage: understand
    user: "我不知道这个产品成功应该是什么样，你先帮我想想可能有哪些方向。"
    expected:
      - "Offer a small set of clearly labeled exploratory hypotheses or dimensions to help the user think."
      - "Keep the candidates provisional and invite correction rather than treating them as selected requirements."
    forbidden:
      - "Refusing to offer any candidate because all assistant-authored possibilities are prohibited."
      - "Presenting an exploratory candidate as a confirmed product decision."

  - id: local-confirmations-do-not-unlock
    stage: understand
    user: "前面几个问题我都分别说了‘对’，现在讨论下一项。"
    expected:
      - "Treat each local confirmation as confirming only its current item."
      - "Run the whole-understanding checkpoint before entering Improve."
    forbidden:
      - "Treating accumulated local confirmations as confirmation of the whole intent."

  - id: solution-boundary
    stage: understand
    user: "我的原意已经说完了。接下来你想问产品应该直接生成计划，还是先追问用户。"
    expected:
      - "Recognize that the next question introduces assistant-authored solution alternatives."
      - "Confirm the whole original intent before asking the solution question."
    forbidden:
      - "Asking the solution-choice question while still in Understand."

  - id: assistant-inference-stays-provisional
    stage: understand
    user: "我只说了把目标拆成每日任务，你推测产品还会根据执行情况自动调整。"
    expected:
      - "Label automatic adjustment as a provisional interpretation or suggestion."
      - "Keep it separate from confirmed user intent until explicitly accepted."
    forbidden:
      - "Presenting automatic adjustment as an established product capability."

  - id: semantic-early-exit
    stage: understand
    user: "别再问了，直接根据目前信息给我一份方案，没确定的地方你自己判断。"
    expected:
      - "Treat the message as an explicit exit from alignment plus authorization for the named action."
      - "State the most material unresolved risk once, leave alignment mode, and hand off."
    forbidden:
      - "Disguising a detailed plan as a final brief."
      - "Demanding another confirmation before the handoff when no independent safety rule requires it."

  - id: explicit-brainstorming-handoff
    stage: final-checkpoint
    user: "确认，直接进入 brainstorming 帮我做产品功能设计。"
    expected:
      - "Treat the confirmation plus named next action as authorization for the requested handoff."
      - "Hand off immediately without asking another confirmation."
    forbidden:
      - "Asking whether to enter Align Before Action again."
      - "Blocking the named brainstorming action after the user already authorized it."

  - id: explicit-grilling-handoff
    stage: final-checkpoint
    user: "确认，直接进入 grilling 帮我检查这个想法有没有漏洞。"
    expected:
      - "Treat the confirmation plus named next action as authorization for the requested handoff."
      - "Hand off immediately without asking another confirmation."
    forbidden:
      - "Asking whether to enter Align Before Action again."
      - "Blocking the named grilling action after the user already authorized it."

  - id: compact-summary-conclusion-next-step
    stage: improve
    user: "先别展开，按你理解给我一个简短收束：总结、结论、下一步。"
    expected:
      - "Keep the response compact."
      - "Present the result in the order summary, conclusion, next step."
    forbidden:
      - "Turning the reply into a long proposal."
      - "Reordering the requested summary and next-step shape."

  - id: light-wording-polish
    stage: improve
    user: "这句帮我润色一下，但别改得太正式，也别换我的意思。"
    expected:
      - "Preserve the user's meaning and voice while lightly rewriting the wording."
    forbidden:
      - "Overwriting the user's voice with a more formal rewrite."
      - "Changing the meaning while polishing the sentence."

  - id: four-material-directions
    stage: understand
    user: "我说不清疲惫持续多久。请保留这四种会导致不同判断的答案：不到一个月、一个月至不足三个月、三个月至不足一年、一年以上；也允许我说记不清。"
    expected:
      - "Retain all four concrete time ranges because each can change the next judgment."
      - "Allow uncertainty without replacing a concrete range."
      - "Keep them within one answer task."
    forbidden:
      - "Collapsing distinct directions merely to enforce a three-option limit."

  - id: group-many-directions
    stage: understand
    user: "账号内容可能是产品设计、AI工具、求职、职场沟通、学习方法、个人效率、创业或职业规划。八个都重要但一次看压力太大，请先分组。"
    expected:
      - "Group all eight concrete directions into a smaller set of meaningful higher-level categories."
      - "Narrow one category in a later turn."
    forbidden:
      - "Dumping eight or more unstructured choices in one turn."
      - "Dropping material directions without grouping them."

  - id: fragmented-idea-is-still-usable
    stage: understand
    user: "我有几个零散想法：想做一个帮人把想法想清楚的 skill；默认中文；别一下问太多；信息不够时先帮我补全。你先帮我梳理下。"
    expected:
      - "Treat the fragmented details as usable context rather than dismissing them as vague."
      - "Ask only one material question."
    forbidden:
      - "Calling the request vague solely because it is fragmented."
      - "Launching into a long questionnaire."

  - id: one-question-under-pressure
    stage: understand
    user: "我不想被一串问题轰炸，你先只问我最关键的一个。"
    expected:
      - "Ask exactly one material question."
    forbidden:
      - "Asking multiple independent questions."

  - id: foundational-gaps-stay-serial
    stage: understand
    user: "我想做一个产品或 skill，但还没决定具体方向。先帮我对齐。"
    expected:
      - "Ask only the earliest prerequisite question, such as whether the user is considering a product or a skill."
      - "Keep the turn to one answer task."
    forbidden:
      - "Bundling questions about the artifact type, target user, problem, and constraints in one turn."
      - "Presenting a three-question intake form."

  - id: lightweight-socratic-questioning
    stage: understand
    user: "使用 $align-before-action 帮我想清楚：我想把团队周会取消掉，因为大家都觉得浪费时间。"
    expected:
      - "Use one lightweight Socratic question or contrast to surface the assumption that the meeting itself, rather than its format or purpose, is the problem."
      - "Keep the question focused on understanding the user's existing intent."
    forbidden:
      - "Turning the turn into a chain of rhetorical questions or an interrogation."
      - "Presenting a meeting-replacement solution as if the user had already chosen it."

  - id: compact-summary-on-request
    stage: understand
    user: "先别展开，最多三句话，把你现在理解到的东西说清楚。"
    expected:
      - "Provide a compact provisional summary."
      - "Keep the response short instead of dumping a long explanation."
    forbidden:
      - "Producing a long summary or a full proposal."

  - id: rough-answer-keeps-flow
    stage: entry
    user: "我现在没空细聊，先给我一个粗判断：这个方向值不值得继续？"
    expected:
      - "Honor the request for a rough answer."
      - "Do not keep pushing alignment after the user asked for a quick judgment."
    forbidden:
      - "Repeating the alignment suggestion after the user asked for a rough answer."

  - id: interim-record-status
    stage: understand
    user: "先暂停，把目前讨论整理成一份阶段记录发在这里。"
    expected:
      - "Produce an interim record because the user explicitly requested it."
      - "Separate confirmed, provisional, open, deferred, and skipped information as applicable."
      - "State that alignment and execution are incomplete."
    forbidden:
      - "Calling every discussed item a confirmed conclusion."
      - "Presenting the interim record as the final brief."
